# =====================================================================
# ms-juego  -  puerto 8083  -  base de datos MySQL "aprendoia_juego"
# La base se CREA sola (createDatabaseIfNotExist) y se POBLA con
# schema.sql + data.sql cada vez que inicia Spring Boot.
# Para ejecutar sin MySQL: perfil h2  (ver README)
# =====================================================================
spring.application.name=ms-juego
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/aprendoia_juego?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas las crea schema.sql (no Hibernate) y los datos iniciales data.sql
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Documentación de endpoints: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Comunicación entre microservicios: ms-juego valida los QR en ms-contenidos
servicios.contenidos.url=${CONTENIDOS_URL:http://localhost:8082}
