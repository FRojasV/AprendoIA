# Perfil "h2": base de datos en memoria, sin instalar MySQL.
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Consola web:   http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:mem:aprendoia_usuarios, usuario sa)
spring.datasource.url=jdbc:h2:mem:aprendoia_usuarios;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# H2 no adelanta el contador AUTO_INCREMENT al insertar ids fijos (data.sql):
# este script extra lo deja en 1000 para que los nuevos registros no choquen.
spring.sql.init.data-locations=classpath:data.sql,classpath:h2-ajuste.sql
